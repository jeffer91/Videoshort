<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b13"><link rel="manifest" href="./manifest.webmanifest"><title>Videoshort Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#080d0a;color:#f1f7f2;font:15px system-ui}main{max-width:550px;margin:auto;padding:18px 15px 60px}header{display:flex;align-items:center;gap:11px;margin-bottom:22px}.logo{background:#159647;padding:11px 14px;border-radius:13px;font-size:23px}h1{font-size:23px;margin:0}h2{font-size:17px;margin:0 0 14px}.muted,small{color:#a9bbae}small{font-size:12px}.panel{background:#142019;border:1px solid #2b4733;border-radius:18px;padding:17px;margin:14px 0}.steps{display:flex;gap:5px;margin:0 0 17px}.stepDot{height:5px;background:#33463a;border-radius:5px;flex:1}.stepDot.active{background:#20bf60}.upload{display:block;cursor:pointer;text-align:center;border:1.5px dashed #4a9861;background:#1a2d20;border-radius:13px;padding:20px 10px;margin:12px 0}.upload strong{display:block;font-size:15px;margin-bottom:6px}input[type=file]{display:block;max-width:100%;font-size:12px;margin:12px auto 0}button{background:#168f43;color:white;border:0;border-radius:12px;padding:13px 16px;font-size:14px;font-weight:700;cursor:pointer}button:disabled{opacity:.42}button.alt{background:#2a3d31}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.buttons button{flex:1}.styleGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.styleGrid label{border:1px solid #3d5d47;border-radius:12px;padding:8px 5px;text-align:center;cursor:pointer;background:#192a1e;font-size:12px}.styleGrid label:has(input:checked){border:2px solid #24d765;background:#214b2f}.styleGrid input{position:absolute;opacity:0}.styleGrid b{display:block;font-size:22px;margin-bottom:5px}.stage{max-width:270px;margin:auto}canvas{display:block;width:100%;aspect-ratio:9/16;border-radius:12px;background:#0b130d}#status{font-size:12px;color:#afc1b2;min-height:18px;margin-top:12px}progress{width:100%;height:7px;accent-color:#21c85e}#advanced{margin-top:12px}#advanced summary{font-size:12px;color:#9db1a2;cursor:pointer}#advanced label{display:block;margin:12px 0;font-size:13px}select,input[type=range]{width:100%;margin-top:5px}#imagesBox{display:none;margin:10px 0;font-size:13px}#imagesBox input{display:block;margin-top:8px}footer{color:#809786;text-align:center;font-size:11px;margin:18px}
</style></head><body><main><header><div class="logo">▶</div><div><h1>Videoshort Studio</h1><small>Videos de fútbol en 3 pasos</small></div></header><div class="steps" id="steps"><span class="stepDot active"></span><span class="stepDot"></span><span class="stepDot"></span><span class="stepDot"></span></div>
<section class="panel"><h2 id="stepTitle">1. Gancho</h2><p class="muted" id="stepHelp">Sube tu video y mira el resultado.</p>
<label id="hookBox" class="upload"><strong>＋ Subir gancho</strong><small>Video de hasta 2 minutos</small><input id="hook" type="file" accept="video/*"></label>
<label id="bodyBox" class="upload" style="display:none"><strong>＋ Subir contenido</strong><small>Tu fondo se elimina automáticamente</small><input id="body" type="file" accept="video/*"></label>
<label id="ctaBox" class="upload" style="display:none"><strong>＋ Subir pregunta</strong><small>Final deportivo con llamada a la acción</small><input id="cta" type="file" accept="video/*"></label>
<label id="imagesBox">Imágenes para el fondo<input id="images" type="file" accept="image/*" multiple></label>
<div id="styles"><h2>Elige un estilo</h2><div class="styleGrid"><label><input type="radio" name="style" value="stadium" checked><b>🏟️</b>Estadio</label><label><input type="radio" name="style" value="studio"><b>🎙️</b>Estudio</label><label><input type="radio" name="style" value="tactics"><b>⚽</b>Táctico</label></div></div>
<details id="advanced"><summary>Ajustes opcionales</summary><label>Posición <select id="position"><option value="left">Izquierda</option><option value="right">Derecha</option><option value="center">Centro</option></select></label><label>Tamaño <input id="scale" type="range" min="40" max="100" value="68"></label><input id="energy" type="hidden" value="7"><select id="fallback" style="display:none"><option value="blue">Verde</option><option value="dark">Oscuro</option></select></details>
<button id="prepare" style="display:none">Volver a preparar</button><div class="buttons"><button id="back" class="alt" style="display:none">← Atrás</button><button id="approve" disabled>Aprobar y continuar →</button></div></section>
<section class="panel"><h2>Vista previa</h2><div class="stage"><canvas id="stage" width="540" height="960"></canvas></div><div class="buttons"><button id="play" disabled>▶ Ver video</button><button id="stop" class="alt" disabled>■ Detener</button><button id="export" disabled style="display:none">Unir y descargar</button></div><div id="status" role="status" aria-live="polite">Sube un video para empezar.</div><progress id="progress" value="0" max="100"></progress></section><footer>Procesamiento en tu dispositivo · Exportación WebM experimental</footer></main><script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/selfie_segmentation.js"></script><script src="./app.js?v=football6" defer></script></body></html>
